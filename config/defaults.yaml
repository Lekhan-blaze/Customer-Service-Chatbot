company_timezone: Asia/Kolkata
business_hours:
  start: 09:00
  end: '18:00'
  days:
  - Mon
  - Tue
  - Wed
  - Thu
  - Fri
next_working_day_schedule_time: 09:00
holidays: []
sla:
  first_response_minutes: 30
  resolution_hours: 24
retention:
  audit_days: 90
  session_days: 30
session:
  inactivity_timeout_minutes: 30
  restore_window_hours: 24
supported_languages:
- English
- Hindi
- Tamil
- Kannada
maintenance_window:
  start: 02:00
  end: 04:00
injection_detection:
  enabled: true
  threshold: 0.6
job_retry_backoff_minutes:
- 15
- 30
- 60
conversation:
  enabled: true
  confidence_threshold: 0.65
  language_confidence_threshold: 0.6
  intent_confidence_threshold: 0.6
  max_recent_messages: 10
sentiment:
  sarcasm_threshold: 0.6
  recent_messages_count: 5
  low_confidence_threshold: 0.45
  calibration:
    enabled: true
    weights:
      positive:
        a: 3.6231
        b: -2.8442
        enabled: true
      neutral:
        a: 1.0
        b: 0.0
        enabled: false
      negative:
        a: 1.0
        b: 0.0
        enabled: false
      frustrated:
        a: 1.0
        b: 0.0
        enabled: false
      urgent:
        a: 3.6086
        b: -2.7975
        enabled: true
      sarcastic:
        a: 2.5
        b: -1.1
        enabled: true
escalation:
  enabled: true
  repeated_negative_threshold: 2
  risk_threshold: 0.6
  risk_thresholds:
    account_compromise: 0.7
    duplicate_payment: 0.45
    legal_threat: 0.45
    data_breach: 0.6
    default: 0.6
  risk_clarification_min: 0.3
  urgent_threshold: 0.65
  unresolved_negative_timeout_minutes: 15
  high_risk_categories:
  - account_compromise
  - duplicate_payment
  - legal_threat
  - data_breach
demo_panel_enabled: true

tickets:
  enabled: true
  mandatory_fields:
    - customer_name
    - order_or_enrollment_id
    - product_or_course
    - issue_type
    - description
  sla_hours_by_priority:
    P1: 4
    P2: 8
    P3: 24
    P4: 48
  warning_threshold_ratio: 0.75
  teams:
    billing:
      skills: ["payment", "duplicate_payment", "refund", "invoice", "fee"]
      available: true
      max_workload: 10
      current_workload: 0
    technical:
      skills: ["course_access", "video_error", "login", "bug", "platform"]
      available: true
      max_workload: 15
      current_workload: 0
    academic:
      skills: ["curriculum", "mentor", "assignment", "certificate", "syllabus"]
      available: true
      max_workload: 12
      current_workload: 0
  fallback_team: "general_support"

files:
  enabled: true
  allowed_extensions:
    - .png
    - .jpg
    - .jpeg
    - .pdf
  max_size_bytes: 10485760  # 10 MB
  retention_days: 30
  ocr_confidence_threshold: 0.5
  processing_timeout_seconds: 30
  long_running_threshold_seconds: 30
